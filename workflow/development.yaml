# Multi-Agent Debate Workflow
# Canonical YAML definition — rendered into documentation and executable by the orchestrator.

workflow:
  name: development
  description: >
    PM-orchestrated multi-agent debate workflow for SDLC.
    Two debate layers (architecture + implementation) with HITL gate.

  max_turn: 3
  squad_leader: pm-agent

knowledge_sources:
  - id: codebase
    type: repository
    description: Project source code and documentation
    access: [read, write]

  - id: llm-wiki
    type: wiki
    description: Obsidian-based organizational knowledge base
    access: [read, write]

agents:
  - id: pm-agent
    role: Squad Leader & Orchestrator
    path: agents/management/pm-agent.md

  - id: sa-agent
    role: Software Architect
    path: agents/solution_architect/sa-agent.md

  - id: sa-critic-agent
    role: Architecture Critic
    path: agents/solution_architect/sa-critic-agent.md

  - id: code-explorer-agent
    role: Codebase Explorer
    path: agents/coding/code-explorer-agent.md

  - id: code-planner-agent
    role: Implementation Planner
    path: agents/coding/code-planner-agent.md

  - id: code-implementer-agent
    role: Code Implementer
    path: agents/coding/code-implementer-agent.md

  - id: code-critic-agent
    role: Code Reviewer
    path: agents/coding/code-critic-agent.md

  - id: qa-critic-agent
    role: QA Reviewer
    path: agents/qa/qa-critic-agent.md

  - id: qa-context-risk-agent
    role: QA Context & Risk Analyst
    path: agents/qa/qa-context-risk-agent.md

  - id: qa-planner-agent
    role: QA Strategy & Planning Lead
    path: agents/qa/qa-planner-agent.md

  - id: qa-generator-review-agent
    role: QA Test Generator & Reviewer
    path: agents/qa/qa-generator-review-agent.md

  - id: devops-agent
    role: DevOps & CI/CD Engineer
    path: agents/devops/devops-agent.md

steps:
  - id: initialization
    type: delegate
    description: PM assigns SA to create a draft SRS from the raw PRD
    actor: sa-agent
    output: draft-srs

  - id: architecture-debate
    type: debate
    description: SA and SA Critic debate to refine the architecture
    actor: sa-agent
    critic: sa-critic-agent
    input: draft-srs
    artifact: srs
    max_turn: 3
    on_approved: hitl
    on_max_turn_reached: hitl

  - id: hitl
    type: hitl
    description: Product Owner reviews and approves the finalized SRS
    artifact: srs
    on_approved: implementation-planning
    on_rejected: initialization

  - id: implementation-planning
    type: delegate
    description: PM breaks down tasks and assigns to Workers
    actor: pm-agent
    input: srs
    output: task-breakdown

  - id: worker-plans
    type: fanout
    description: Explorer gathers context, Planner creates implementation plan
    input: task-breakdown
    workers:
      - id: explore-context
        actor: code-explorer-agent
        output: codebase-context

      - id: plan-implementation
        actor: code-planner-agent
        input: codebase-context
        output: draft-implementation-plan

  - id: planner-debate
    type: debate
    description: Code-Critic reviews Planner's implementation plan
    actor: code-planner-agent
    critic: code-critic-agent
    artifact: draft-implementation-plan
    max_turn: 3
    on_approved: qa-context-risk
    on_max_turn_reached: hitl

  - id: qa-context-risk
    type: delegate
    description: QA gathers project context and builds risk matrix
    actor: qa-context-risk-agent
    input: [task-breakdown, srs]
    output: [qa-project-context, risk-matrix]

  - id: qa-planning
    type: delegate
    description: QA Planner creates test strategy + sprint plan + coverage matrix + execution schema
    actor: qa-planner-agent
    input: [qa-project-context, risk-matrix, draft-implementation-plan]
    output: draft-qa-plan

  - id: qa-debate
    type: debate
    description: QA Critic reviews plan for gaps, happy-path bias, NFR coverage, and scope violations
    actor: qa-planner-agent
    critic: qa-critic-agent
    artifact: draft-qa-plan
    max_turn: 3
    on_approved: qa-generate-review
    on_max_turn_reached: hitl

  - id: qa-generate-review
    type: delegate
    description: QA generates test code from approved plan and reviews quality across six dimensions
    actor: qa-generator-review-agent
    input: [approved-qa-plan, approved-implementation-plan]
    output: [test-suites, qa-review-report]
    max_turn: 3

  - id: implementation-execution
    type: delegate
    description: Implementer executes approved plan with TDD
    actor: code-implementer-agent
    input: approved-implementation-plans
    max_turn: 3
    on_max_turn_reached: cicd-setup

  - id: plan-compliance-review
    type: delegate
    description: Planner verifies implementation matches approved plan
    actor: code-planner-agent
    input:
      - approved-implementation-plan
      - execution-results
    output: compliance-report

  - id: cicd-setup
    type: delegate
    description: DevOps wires QA-defined commands/metrics/reports/schemas into CI/CD pipeline
    actor: devops-agent
    input: [test-suites, qa-review-report, qa-defined-schemas]
    output: cicd-pipeline

  - id: hitl-execution
    type: hitl
    description: Human reviews execution/test results and plan compliance before completion
    artifact: execution-results + compliance-report + approved-qa-plan + qa-review-report
    on_approved: completion
    on_rejected: implementation-execution

  - id: completion
    type: delegate
    description: PM synthesizes results and reports
    actor: pm-agent
    input: execution-results
